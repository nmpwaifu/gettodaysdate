name: Publish to npm

# Publishes gettodaysdate using the headless Puppeteer + WebAuthn shim flow
# (deliberately not OIDC/trusted publishing). npm's CLI web login is driven in a
# headless Chromium where a page-level shim signs the WebAuthn challenge with a
# P-256 key supplied as a secret.
#
# Security posture:
#   - Never pull_request: this repo is public, and a fork PR able to reach these
#     secrets would hand over the npm account.
#   - Bound to the `Publish` environment. NOTE: if that environment requires a
#     reviewer, scheduled runs pause for approval instead of publishing
#     unattended. See the scheduling notes below.
#   - The private key is written to a mode-600 file under a temp dir and removed
#     in an always() step.
#
# Scheduling notes:
#   - The cron fires at 00:04 UTC daily and always uses a patch bump with the
#     runner's current date. GitHub queues cron on a best-effort basis, so the
#     actual start can drift by minutes under load.
#   - Cron only ever runs the workflow file from the default branch.
#   - GitHub disables scheduled workflows after 60 days without repo activity.
#     The daily release commit counts as activity, so this stays alive while it
#     keeps succeeding.

on:
  schedule:
    # 00:04 UTC daily.
    - cron: '4 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'ISO date to hardcode (YYYY-MM-DD). Blank = runner today.'
        required: false
        type: string
      release:
        description: 'Version bump'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: 'Prepare and test only; do not publish'
        required: false
        default: false
        type: boolean

# Needed to push the version bump back to the branch.
permissions:
  contents: write

concurrency:
  # Serialize publishes: two concurrent runs would race on the version number
  # and on npm's server-side WebAuthn signature counter.
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    # The deliberate settle pauses between browser steps, plus up to 3 login
    # attempts and 2 publish attempts, make a slow-but-successful run legitimately
    # long. Keep headroom so a retry is never cut off mid-publish.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT-free checkout; the default token can push to this repo.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Pinned to a commit SHA, not a tag. This job holds the npm password and
      # the P-256 signing key, so a repointed mutable tag on a third-party
      # action would run attacker code with access to both. Update deliberately.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        with:
          chrome-version: stable

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          "${{ steps.chrome.outputs.chrome-path }}" --version
          # The publish step needs a real PTY (npm demands EOTP otherwise) plus a
          # FIFO for stdin, so fail fast and clearly if either is missing.
          command -v script
          command -v mkfifo

      - name: Install release tooling
        working-directory: .release
        run: npm ci

      - name: Stage signing key
        id: key
        env:
          NPM_P256_PRIVATE_KEY: ${{ secrets.NPM_P256_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_P256_PRIVATE_KEY}" ]; then
            echo "::error::NPM_P256_PRIVATE_KEY is not set in the Publish environment"
            exit 1
          fi
          KEY_DIR="$(mktemp -d)"
          chmod 700 "${KEY_DIR}"
          # Quoted expansion preserves the PEM's newlines.
          printf '%s\n' "${NPM_P256_PRIVATE_KEY}" > "${KEY_DIR}/private.pem"
          chmod 600 "${KEY_DIR}/private.pem"
          # Confirm it parses as an EC key without printing any key material.
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const key = crypto.createPrivateKey(fs.readFileSync(process.argv[1], "utf8"));
            if (key.asymmetricKeyType !== "ec") {
              console.error(`::error::expected an ec key, got ${key.asymmetricKeyType}`);
              process.exit(1);
            }
            console.log("signing key parsed: ec");
          ' "${KEY_DIR}/private.pem"
          echo "dir=${KEY_DIR}" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NPM_KEY_DIR: ${{ steps.key.outputs.dir }}
          NPM_RUN_DIR: ${{ runner.temp }}/release-run
          NPM_USERNAME: ${{ vars.NPM_USERNAME }}
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
          NPM_CREDENTIAL_ID: ${{ vars.NPM_CREDENTIAL_ID }}
          # Inputs are empty on a schedule trigger, so default them here.
          # Passed through env rather than interpolated into the script body: a
          # value containing shell metacharacters would otherwise be executed.
          IN_DATE: ${{ inputs.date }}
          IN_RELEASE: ${{ inputs.release || 'patch' }}
          IN_DRY_RUN: ${{ inputs.dry_run || false }}
        working-directory: .release
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${IN_DATE}" ]; then
            case "${IN_DATE}" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ARGS+=("--date=${IN_DATE}") ;;
              *) echo "::error::date must be YYYY-MM-DD, got '${IN_DATE}'"; exit 1 ;;
            esac
          fi
          case "${IN_RELEASE}" in
            patch|minor|major) ARGS+=("--release=${IN_RELEASE}") ;;
            *) echo "::error::release must be patch, minor or major, got '${IN_RELEASE}'"; exit 1 ;;
          esac
          if [ "${IN_DRY_RUN}" = "true" ]; then ARGS+=("--dry-run"); fi
          echo "trigger: ${{ github.event_name }} | release args: ${ARGS[*]}"
          node release.mjs "${ARGS[@]}"

      - name: Remove signing key
        if: always()
        run: rm -rf "${{ steps.key.outputs.dir }}"

      # Auth URLs and cookies can appear in the PTY log and auth trace. Redact
      # before upload: this repo is public and artifacts are downloadable.
      # Both plain and URL-encoded forms occur (the escalation page carries the
      # session as ?next=%2Fauth%2Fcli%2F<uuid>), so cover both.
      #
      # Screenshots are copied verbatim: sed would corrupt binary PNGs. They are
      # page-content only (headless has no URL bar), and npm masks the password
      # field, so they carry no session id or secret.
      - name: Collect diagnostics
        if: always()
        env:
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/release-run"
          OUT="${{ runner.temp }}/diagnostics"
          mkdir -p "${OUT}"
          if [ -d "${SRC}" ]; then
            for f in "${SRC}"/*; do
              [ -f "${f}" ] || continue
              case "${f}" in
                *.fifo) continue;;
                *.png) cp "${f}" "${OUT}/$(basename "${f}")"; continue;;
              esac
              sed -e 's#/auth/cli/[A-Za-z0-9-]*#/auth/cli/REDACTED#g' \
                  -e 's#/login/cli/[A-Za-z0-9-]*#/login/cli/REDACTED#g' \
                  -e 's#%2[Ff]auth%2[Ff]cli%2[Ff][A-Za-z0-9-]*#%2Fauth%2Fcli%2FREDACTED#g' \
                  -e 's#%2[Ff]login%2[Ff]cli%2[Ff][A-Za-z0-9-]*#%2Flogin%2Fcli%2FREDACTED#g' \
                  -e "s#${NPM_PASSWORD//#/\\#}#REDACTED#g" \
                  "${f}" > "${OUT}/$(basename "${f}")" || true
            done
          fi
          # Fail the step if any unredacted session id survived, rather than
          # publishing an artifact that leaks one. The REDACTED placeholder also
          # matches the id pattern, so exclude it from the scan. -a forces binary
          # files (the screenshots) to be scanned as text too: skipping them would
          # leave an unchecked upload path, since PNGs are copied without sed.
          if grep -rnaE '(/|%2[Ff])(auth|login)(/|%2[Ff])cli(/|%2[Ff])[A-Za-z0-9-]{8,}' "${OUT}" 2>/dev/null | grep -av 'REDACTED' | head -5 > /tmp/leaks; then
            if [ -s /tmp/leaks ]; then
              echo "::error::unredacted CLI session id found in diagnostics; not uploading"
              cat /tmp/leaks
              rm -rf "${OUT}" /tmp/leaks
              exit 1
            fi
          fi
          rm -f /tmp/leaks
          echo "### Diagnostics collected" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "${OUT}" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "${OUT}" || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit version bump
        if: success() && inputs.dry_run != true
        env:
          # Scheduled runs have no ref name conflict, but be explicit so the
          # push target is unambiguous for both triggers.
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.js test.js README.md package.json; then
            echo "no source changes to commit"
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.js test.js README.md package.json
          git commit -m "Release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD:"${TARGET_BRANCH}"
          git push origin "v${VERSION}"
